name: EXP-010 快轨（52 分片 ≈52k 先出分数；补采完成后的 80k 全集另跑）

on:
  workflow_dispatch:

env:
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1
  PREV_COLLECT_RUN_ID: "33771773228"

jobs:
  assemble52:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download 前跑已完成分片（run 33771773228，52 个）
        uses: actions/download-artifact@v4
        with:
          pattern: EXP-010-shard*
          path: downloaded
          repository: xf8410/uma-ramen-nn-lab-exp010
          run-id: ${{ env.PREV_COLLECT_RUN_ID }}
          github-token: ${{ github.token }}
          merge-multiple: false
      - name: 合并可用分片（不要求 80 全齐，≥50 即开训）
        run: |
          python3 - <<'PY'
          import json, glob, os, shutil

          found = {}
          for d in sorted(glob.glob("downloaded/EXP-010-shard*")):
              shard = int(os.path.basename(d)[len("EXP-010-shard"):])
              assert shard not in found, f"分片 {shard} 重复"
              found[shard] = d
          shards = sorted(found)
          print(f"可用分片 {len(shards)} 个")
          assert len(shards) >= 50, f"分片过少: {len(shards)}"

          manifests = []
          for i in shards:
              hits = glob.glob(f"{found[i]}/**/part_000000.bin", recursive=True)
              assert hits, f"shard {i} part 未找到"
              pdir = os.path.dirname(hits[0])
              m = json.load(open(os.path.join(pdir, "manifest.json")))
              assert m["search_n"] == 16, f"shard {i} search_n={m['search_n']}"
              assert m["git_commit"] == "d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1", f"shard {i} git {m['git_commit']}"
              assert m["finished_at"], f"shard {i} 未完成"
              m["_dir"] = pdir
              m["_shard"] = i
              manifests.append(m)

          base = manifests[0]
          os.makedirs("dataset", exist_ok=True)
          parts, gidx, total = [], 0, 0
          for m in manifests:
              assert m["index_start"] == m["_shard"] * 1000 and m["index_end"] == m["_shard"] * 1000 + 1000, \
                  f"shard {m['_shard']} 区间错: [{m['index_start']},{m['index_end']})"
              assert m["recipe_hash_fnv1a64"] == base["recipe_hash_fnv1a64"], f"shard {m['_shard']} 配方不一致"
              for p in m["parts"]:
                  shutil.copy(os.path.join(m["_dir"], p["name"]), f"dataset/part_{gidx:06d}.bin")
                  parts.append({**p, "name": f"part_{gidx:06d}.bin"})
                  gidx += 1
              total += m["accepted"]

          merged = {**base, "index_start": shards[0] * 1000, "index_end": (shards[-1] + 1) * 1000,
                    "parts": parts, "accepted": total,
                    "skipped_uncaptured": sum(m["skipped_uncaptured"] for m in manifests),
                    "shards_used": shards,
                    "note": f"fast52: {len(shards)} shards non-contiguous (teacher=NN 009b champion 66734.8, sn16)"}
          merged.pop("_dir", None); merged.pop("_shard", None)
          json.dump(merged, open("dataset/manifest.json", "w"), ensure_ascii=False, indent=2)
          summary = f"shards={len(shards)} accepted={total} parts={gidx} recipe={base['recipe_hash_fnv1a64']}"
          print("MERGED:", summary)
          open("dataset/SUMMARY.txt", "w").write(summary + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-010-dataset-fast52
          path: dataset/
          retention-days: 30
          if-no-files-found: error

  convert:
    needs: assemble52
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - name: Apply EXP-010 patch
        run: python3 lab/experiments/EXP-010-selfdistill-v4/patch_exp010.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp010-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp010-${{ runner.os }}-
            lab-exp009-${{ runner.os }}-
      - name: Download fast52 dataset
        uses: actions/download-artifact@v4
        with:
          name: EXP-010-dataset-fast52
          path: training_data/exp010_fast52
      - name: Build ramen_export_npy
        run: cargo build --release -p umasim --bin ramen_export_npy
      - name: Export npy (--raw)
        run: ./target/release/ramen_export_npy --input training_data/exp010_fast52 --output-dir training_data/npy_v4 --raw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxruntime
      - name: Generate labels
        run: python3 scripts/ramen_nn/labels.py --input training_data/npy_v4 --output training_data/labels_v4
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-010-npy-labels-fast52
          path: |
            training_data/npy_v4
            training_data/labels_v4
          retention-days: 30
          if-no-files-found: error

  train:
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: fast52-s20260830, seed: "20260830", extra: "--epochs 400" }
          - { id: fast52-s20260831, seed: "20260831", extra: "--epochs 400" }
          - { id: fast52-s20260832, seed: "20260832", extra: "--epochs 400" }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxruntime
      - name: Download npy + labels
        uses: actions/download-artifact@v4
        with:
          name: EXP-010-npy-labels-fast52
          path: training_data
      - name: Train (${{ matrix.id }})
        run: |
          python3 scripts/ramen_nn/train.py \
            --data training_data/npy_v4 \
            --labels training_data/labels_v4 \
            --output-dir saved_models/${{ matrix.id }} \
            --seed ${{ matrix.seed }} \
            --device cpu \
            ${{ matrix.extra }}
      - name: Export ONNX
        run: |
          python3 scripts/ramen_nn/export_onnx.py \
            --checkpoint saved_models/${{ matrix.id }}/best.pt \
            --output saved_models/${{ matrix.id }}/model.onnx
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-010-model-${{ matrix.id }}
          path: saved_models/${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error

  summary:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-010-model-fast52-*
          path: downloaded
          merge-multiple: false
      - name: 汇总（只记不裁决；裁决=010b 闭环）
        run: |
          python3 - <<'PY'
          import json, glob, os

          results = {}
          for d in sorted(glob.glob("downloaded/EXP-010-model-fast52-*")):
              tag = os.path.basename(d).replace("EXP-010-model-", "")
              metrics = [json.loads(l) for l in open(f"{d}/metrics.jsonl")]
              best = min(rec["best_regret"] for rec in metrics)
              results[tag] = (best, len(metrics))
              print(f"{tag}: best_regret={best:.1f} ({len(metrics)} ep)")

          full = [v[0] for v in results.values()]
          mean = sum(full) / len(full)
          spread = max(full) - min(full)
          print(f"\nfast52 3-seed mean best_regret (NN 教师口径, sn16 @ ~52k, ep400) = {mean:.1f}")
          print(f"种子散布 (max-min) = {spread:.1f}")
          print("⚠ regret 口径随教师变，与 008/009 不可直接比；只看散布与早停健康性")
          lines = [f"{k}: {v[0]:.1f} ({v[1]} ep)" for k, v in results.items()] + [f"mean={mean:.1f}", f"spread={spread:.1f}"]
          open("SUMMARY.txt", "w").write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-010-summary-fast52
          path: SUMMARY.txt
          retention-days: 30
          if-no-files-found: error
