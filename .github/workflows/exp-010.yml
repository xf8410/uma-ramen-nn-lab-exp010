name: EXP-010 自蒸馏 v4 正式（NN 教师=009b 冠军 66734.8，sn16×80k，80 分片 × 1000）

on:
  workflow_dispatch:

env:
  UPSTREAM_REPO: muxueliunian/umaai-rs-muxue
  UPSTREAM_REF: d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1
  MODEL_REPO: xf8410/uma-ramen-nn-lab
  MODEL_RUN_ID: "33716171772"
  MODEL_ARTIFACT: EXP-009-model-seed20260831

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [9, 20, 30, 31, 33, 35, 36, 37, 52, 54, 59, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - name: Verify upstream pin
        run: |
          GOT=$(git rev-parse HEAD)
          [ "$GOT" = "$UPSTREAM_REF" ] || { echo "PIN_MISMATCH: $GOT"; exit 1; }
      - name: Apply EXP-010 patch
        run: python3 lab/experiments/EXP-010-selfdistill-v4/patch_exp010.py
      - name: Patch 自检
        run: grep -n 'RamenNnTrainer::load' crates/umasim/src/search/searchable.rs
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp010-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp010-${{ runner.os }}-
            lab-exp009-${{ runner.os }}-
      - name: Download champion model（跨仓：主仓 run 33716171772）
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MODEL_ARTIFACT }}
          path: models/champion
          repository: ${{ env.MODEL_REPO }}
          run-id: ${{ env.MODEL_RUN_ID }}
          github-token: ${{ github.token }}
      - name: 定位模型并注入环境变量
        run: |
          ONNX=$(find models/champion -name model.onnx | head -1)
          [ -n "$ONNX" ] && [ -f "$ONNX.json" ] || { echo "模型或旁路 JSON 缺失"; exit 1; }
          echo "RAMEN_NN_MODEL=$PWD/$ONNX" >> "$GITHUB_ENV"
      - name: Collect sn16 shard ${{ matrix.shard }}（×1000）
        run: bash lab/experiments/EXP-010-selfdistill-v4/run.sh ${{ matrix.shard }} 1000
      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-010-shard${{ matrix.shard }}
          path: experiment_output/
          retention-days: 30
          if-no-files-found: error

  assemble:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-010-shard*
          path: downloaded
          merge-multiple: false
      - name: 合并 80 分片（80k，区间 [i*1000,(i+1)*1000)）
        run: |
          python3 - <<'PY'
          import json, glob, os, shutil

          manifests = []
          for i in range(80):
              hits = glob.glob(f"downloaded/EXP-010-shard{i}/**/part_000000.bin", recursive=True)
              assert hits, f"shard {i} part 未找到（本轮只补采部分分片，其余分片 artifact 应已在仓）"
              ddir = os.path.dirname(hits[0])
              m = json.load(open(os.path.join(ddir, "manifest.json")))
              assert m["search_n"] == 16, f"shard {i} search_n={m['search_n']}"
              assert m["git_commit"] == "d27a6ebd3e0e0daeadb1bd5a3d137b97747009d1", f"shard {i} git {m['git_commit']}"
              m["_dir"] = ddir
              manifests.append(m)

          base = manifests[0]
          os.makedirs("dataset", exist_ok=True)
          parts, gidx, total = [], 0, 0
          for i, m in enumerate(manifests):
              s, e = i * 1000, (i + 1) * 1000
              assert m["index_start"] == s and m["index_end"] == e, f"shard {i} 区间错: [{m['index_start']},{m['index_end']})"
              assert m["finished_at"], f"shard {i} 未完成"
              assert m["recipe_hash_fnv1a64"] == base["recipe_hash_fnv1a64"], f"shard {i} 配方不一致"
              for p in m["parts"]:
                  shutil.copy(os.path.join(m["_dir"], p["name"]), f"dataset/part_{gidx:06d}.bin")
                  parts.append({**p, "name": f"part_{gidx:06d}.bin"})
                  gidx += 1
              total += m["accepted"]
              print(f"shard {i}: accepted={m['accepted']} skipped={m['skipped_uncaptured']}")

          merged = {**base, "index_start": 0, "index_end": 80000, "parts": parts, "accepted": total,
                    "skipped_uncaptured": sum(m["skipped_uncaptured"] for m in manifests),
                    "note": "merged from 80 matrix shards (EXP-010 selfdistill-v4, teacher=RamenNnTrainer 009b champion 66734.8, sn16, 80k)"}
          merged.pop("_dir", None)
          json.dump(merged, open("dataset/manifest.json", "w"), ensure_ascii=False, indent=2)
          summary = f"accepted={total} skipped={merged['skipped_uncaptured']} parts={gidx} recipe={base['recipe_hash_fnv1a64']}"
          print("MERGED:", summary)
          open("dataset/SUMMARY.txt", "w").write(summary + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-010-dataset
          path: dataset/
          retention-days: 30
          if-no-files-found: error

  convert:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/checkout@v4
        with:
          path: lab
      - name: Apply EXP-010 patch（convert 不采集，但保持树一致）
        run: python3 lab/experiments/EXP-010-selfdistill-v4/patch_exp010.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lab-exp010-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lab-exp010-${{ runner.os }}-
            lab-exp009-${{ runner.os }}-
      - name: Download EXP-010 dataset
        uses: actions/download-artifact@v4
        with:
          name: EXP-010-dataset
          path: training_data/exp010_merged
      - name: Build ramen_export_npy（无 onnx，验证 cfg 分支可编译）
        run: cargo build --release -p umasim --bin ramen_export_npy
      - name: Export npy (--raw)
        run: ./target/release/ramen_export_npy --input training_data/exp010_merged --output-dir training_data/npy_v4 --raw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxruntime
      - name: Generate labels
        run: python3 scripts/ramen_nn/labels.py --input training_data/npy_v4 --output training_data/labels_v4
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-010-npy-labels
          path: |
            training_data/npy_v4
            training_data/labels_v4
          retention-days: 30
          if-no-files-found: error

  train:
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: seed20260830, seed: "20260830", extra: "--epochs 400" }
          - { id: seed20260831, seed: "20260831", extra: "--epochs 400" }
          - { id: seed20260832, seed: "20260832", extra: "--epochs 400" }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxruntime
      - name: Download npy + labels
        uses: actions/download-artifact@v4
        with:
          name: EXP-010-npy-labels
          path: training_data
      - name: Train (${{ matrix.id }})
        run: |
          python3 scripts/ramen_nn/train.py \
            --data training_data/npy_v4 \
            --labels training_data/labels_v4 \
            --output-dir saved_models/${{ matrix.id }} \
            --seed ${{ matrix.seed }} \
            --device cpu \
            ${{ matrix.extra }}
      - name: Export ONNX
        run: |
          python3 scripts/ramen_nn/export_onnx.py \
            --checkpoint saved_models/${{ matrix.id }}/best.pt \
            --output saved_models/${{ matrix.id }}/model.onnx
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXP-010-model-${{ matrix.id }}
          path: saved_models/${{ matrix.id }}
          retention-days: 30
          if-no-files-found: error

  summary:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EXP-010-model-*
          path: downloaded
          merge-multiple: false
      - name: 汇总（regret 口径随教师变，只记不裁决；裁决=EXP-010b 闭环）
        run: |
          python3 - <<'PY'
          import json, glob, os

          results = {}
          for d in sorted(glob.glob("downloaded/EXP-010-model-*")):
              tag = os.path.basename(d).replace("EXP-010-model-", "")
              mpath = f"{d}/metrics.jsonl"
              assert os.path.exists(mpath), f"metrics.jsonl 缺失: {mpath}"
              metrics = [json.loads(l) for l in open(mpath)]
              best = min(rec["best_regret"] for rec in metrics)
              results[tag] = (best, len(metrics))
              print(f"{tag}: best_regret={best:.1f} ({len(metrics)} ep)")

          full = [v[0] for v in results.values()]
          mean = sum(full) / len(full)
          spread = max(full) - min(full)
          print(f"\n3-seed mean best_regret (NN 教师口径, sn16 @ 80k, ep400) = {mean:.1f}")
          print(f"种子散布 (max-min) = {spread:.1f}")
          print("⚠ 口径警告：教师评估器=NN，regret 与 008/009（手写教师）不可直接比；只看散布与早停健康性")
          lines = [f"{k}: {v[0]:.1f} ({v[1]} ep)" for k, v in results.items()] + [f"mean={mean:.1f}", f"spread={spread:.1f}"]
          open("SUMMARY.txt", "w").write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EXP-010-summary
          path: SUMMARY.txt
          retention-days: 30
          if-no-files-found: error
